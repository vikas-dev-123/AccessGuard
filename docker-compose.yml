services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accessguard
      POSTGRES_USER: accessguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accessguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accessguard -d accessguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://accessguard:${POSTGRES_PASSWORD:-accessguard}@db:5432/accessguard
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
